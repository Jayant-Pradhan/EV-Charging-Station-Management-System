spring.application.name=03-booking-service


server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ev_booking_db
spring.datasource.username=root
spring.datasource.password=Jayant
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=booking-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ev.bookingservice.Kafka.Event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
