spring.application.name=02-station-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/ev_station_db
spring.datasource.username=root
spring.datasource.password=Jayant
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=station-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ev.stationservice.Kafka.Event
spring.kafka.consumer.properties.spring.json.use.type.headers=true

spring.json.add.type.headers=true

#spring.kafka.consumer.properties.spring.json.value.default.type=com.ev.stationservice.Kafka.Event.UserRegisteredEvent


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

