spring.application.name=05-notification-service

server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== Kafka Bootstrap =====
spring.kafka.bootstrap-servers=localhost:9092

# ===== Kafka Consumer Config =====
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.ev.stationservice.Kafka.Event.BookingCreatedEvent:com.ev.notificationservice.Kafka.Event.BookingCreatedEvent,com.ev.paymentservice.Kafka.Event.PaymentCompletedEvent:com.ev.notificationservice.Kafka.Event.PaymentCompletedEvent

# ===== Kafka Producer Config (DLT ke liye zaroori, DeadLetterPublishingRecoverer use ho raha hai) =====
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

